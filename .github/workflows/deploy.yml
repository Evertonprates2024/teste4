name: Deploy Automático KingHost

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Sincronizar com KingHost via FTP
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Baixar código do repositório
        uses: actions/checkout@v4

      - name: 🚀 Sincronizar tema no WordPress
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp

          lftp -u "${{ secrets.FTP_USERNAME }}","${{ secrets.FTP_PASSWORD }}" "${{ secrets.FTP_SERVER }}" << 'EOF'
          set dns:order "inet"
          set ftp:passive-mode true
          set ftp:ssl-allow no
          set net:timeout 30
          set net:max-retries 2

          # 1. Navega até o caminho confirmado pelo WordPress
          cd /home/oranilom/www/wp-content/themes/tema-ade-sampa || \
          cd /www/wp-content/themes/tema-ade-sampa || \
          cd www/wp-content/themes/tema-ade-sampa || \
          cd /wp-content/themes/tema-ade-sampa || \
          cd wp-content/themes/tema-ade-sampa

          echo ">> Conectado com sucesso na pasta do tema!"

          # 2. Sincroniza as alterações diretamente para o tema
          mirror -R --verbose \
            --exclude-glob .git* \
            --exclude-glob .github* \
            --exclude-glob tema-ade-sampa.zip \
            --exclude-glob README.md \
            ./ ./

          quit
          EOF
