name: Deploy Automático KingHost

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  verificar:
    name: Verificar local do FTP
    runs-on: ubuntu-latest
    steps:
      - name: 🔍 Checar pasta atual do FTP
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp

          lftp -u "${{ secrets.FTP_USERNAME }}","${{ secrets.FTP_PASSWORD }}" "${{ secrets.FTP_SERVER }}" << 'EOF'
          set dns:order "inet"
          set ftp:passive-mode true
          set ftp:ssl-allow no
          set net:timeout 15

          echo "=== 1. ONDE O SEU USUÁRIO FTP POUSA ==="
          pwd

          echo "=== 2. O QUE ELE ENXERGA NESSA PASTA ==="
          ls

          quit
          EOF
