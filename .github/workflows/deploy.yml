name: Deploy Automático KingHost

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  identificar:
    name: Identificar caminho do tema
    runs-on: ubuntu-latest
    steps:
      - name: 🔍 Listar pastas da raiz
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp -u "${{ secrets.FTP_USERNAME }}","${{ secrets.FTP_PASSWORD }}" "${{ secrets.FTP_SERVER }}" << 'EOF'
          set ftp:ssl-allow no
          set net:timeout 15
          set net:max-retries 1

          echo "=== PASTAS NA SUA RAIZ FTP ==="
          ls -F

          quit
          EOF
