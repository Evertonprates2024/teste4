name: Deploy Automático KingHost

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Sincronizar com KingHost via FTP
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Baixar código do repositório
        uses: actions/checkout@v4

      - name: 🚀 Sincronizar tema no WordPress
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp

          lftp -u "${{ secrets.FTP_USERNAME }}","${{ secrets.FTP_PASSWORD }}" "${{ secrets.FTP_SERVER }}" << 'EOF'
          # 1. Força conexão IPv4 (evita o erro ETIMEDOUT do IPv6)
          set dns:order "inet"
          
          # 2. Ativa o modo passivo (obrigatório para atravessar o firewall da KingHost)
          set ftp:passive-mode true
          set ftp:ssl-allow no
          set net:timeout 25
          set net:max-retries 2

          # 3. Localiza a pasta tema-ade-sampa que o WordPress acabou de criar
          glob -d */wp-content/themes/tema-ade-sampa cd */wp-content/themes/tema-ade-sampa || \
          glob -d */*/wp-content/themes/tema-ade-sampa cd */*/wp-content/themes/tema-ade-sampa || \
          cd www/wp-content/themes/tema-ade-sampa || \
          cd wp-content/themes/tema-ade-sampa

          echo ">> Pasta conectada com sucesso:"
          pwd

          # 4. Sincroniza todas as alterações diretamente para o tema
          mirror -R --verbose \
            --exclude-glob .git* \
            --exclude-glob .github* \
            --exclude-glob tema-ade-sampa.zip \
            --exclude-glob README.md \
            ./ ./

          quit
          EOF
