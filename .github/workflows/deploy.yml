name: Deploy Automático KingHost

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Sincronizar tema via HTTPS
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Baixar código do repositório
        uses: actions/checkout@v4

      - name: 📦 Compactar tema atualizado
        run: |
          zip -r /tmp/tema-ade-sampa.zip . -x ".git*" -x ".github*" -x "tema-ade-sampa.zip" -x "README.md"

      - name: 🚀 Enviar para o WordPress na KingHost
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "${{ secrets.DEPLOY_URL }}" \
            -F "key=${{ secrets.DEPLOY_SECRET }}" \
            -F "theme_zip=@/tmp/tema-ade-sampa.zip")

          HTTP_BODY=$(echo "$RESPONSE" | sed '$d')
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n 1)

          echo ">> Resposta do servidor KingHost (HTTP $HTTP_STATUS):"
          echo "$HTTP_BODY"

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "❌ Erro no deploy!"
            exit 1
          fi

          echo "✅ Tema atualizado com sucesso no ar!"
