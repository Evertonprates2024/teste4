name: Deploy Automático KingHost

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  descobrir-pastas:
    name: Identificar estrutura de pastas na KingHost
    runs-on: ubuntu-latest
    steps:
      - name: 🔍 Listar diretórios do FTP
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp

          lftp -u "${{ secrets.FTP_USERNAME }}","${{ secrets.FTP_PASSWORD }}" "${{ secrets.FTP_SERVER }}" << 'EOF'
          set ftp:ssl-allow no
          set net:timeout 20

          echo "=== 1. PASTA RAIZ DO SEU FTP ==="
          pwd
          ls -la

          echo "=== 2. LOCALIZANDO O WORDPRESS ==="
          find -d 3 .

          quit
          EOF
