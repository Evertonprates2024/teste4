name: Deploy Automático KingHost

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Sincronizar com KingHost via FTP
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Baixar código do repositório
        uses: actions/checkout@v4

      - name: 🚀 Sincronizar arquivos (Cria pastas automaticamente)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp -c "
            set ftp:ssl-allow no
            set net:timeout 20
            set net:max-retries 3
            open -u '${{ secrets.FTP_USERNAME }}','${{ secrets.FTP_PASSWORD }}' '${{ secrets.FTP_SERVER }}'
            
            # Testa se a raiz usa 'www' ou vai direto para 'wp-content'
            mkdir -p www/wp-content/themes/tema-ade-sampa 2>/dev/null || true
            mkdir -p wp-content/themes/tema-ade-sampa 2>/dev/null || true
            
            # Envia os arquivos criando todas as pastas e subpastas
            mirror -R --verbose \
              --exclude-glob .git* \
              --exclude-glob .github* \
              --exclude-glob tema-ade-sampa.zip \
              --exclude-glob README.md \
              ./ www/wp-content/themes/tema-ade-sampa/ || \
            mirror -R --verbose \
              --exclude-glob .git* \
              --exclude-glob .github* \
              --exclude-glob tema-ade-sampa.zip \
              --exclude-glob README.md \
              ./ wp-content/themes/tema-ade-sampa/
              
            quit
          "
