name: Recuperação de Desastre (Disaster Recovery)

on:
  workflow_dispatch:

jobs:
  recover:
    name: Restaurar WordPress, Plugins e Tema na KingHost
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Checkout do Repositório
        uses: actions/checkout@v4

      - name: 🌐 Executar Reconstrução no Servidor KingHost
        run: |
          KEY="${{ secrets.DEPLOY_SECRET }}"
          URL_ROOT="http://oranilom.com.br/restaurar-site.php?key=${KEY}&format=json"
          URL_THEME="http://oranilom.com.br/wp-content/themes/tema-ade-sampa/restaurar-site.php?key=${KEY}&format=json"
          
          echo "Tentando recuperação na raiz: $URL_ROOT"
          RESPONSE=$(curl -s --max-time 180 "$URL_ROOT" || true)
          
          # Se der 404 na raiz, tenta na pasta do tema
          if ! echo "$RESPONSE" | grep -E -q '"success"[[:space:]]*:[[:space:]]*true'; then
            echo "Tentando caminho alternativo na pasta do tema: $URL_THEME"
            RESPONSE=$(curl -s --max-time 180 "$URL_THEME" || true)
          fi

          echo "Resposta do servidor KingHost:"
          echo "$RESPONSE"
          
          if echo "$RESPONSE" | grep -E -q '"success"[[:space:]]*:[[:space:]]*true'; then
            echo "✅ Site restaurado com sucesso!"
          else
            echo "❌ Erro ao restaurar o site."
            exit 1
          fi

      - name: 🎉 Conclusão
        run: |
          echo "=========================================================="
          echo "  Recuperação Concluída com Sucesso!"
          echo "  Site no ar: http://oranilom.com.br"
          echo "=========================================================="
